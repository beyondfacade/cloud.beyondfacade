# main에 백엔드가 바뀌면: arm64 이미지 빌드 → ECR 푸시 → DB 마이그레이션(새 이미지 Job) → EKS의 API·CronJob 이미지 교체 (serverplan §13-1)
# - CI 역할은 beyondfacade 네임스페이스 안 Edit 권한뿐이라 이미지만 바꾼다.
#   매니페스트(deploy/k8s)가 바뀌면 관리자가 scripts/k8s-apply.sh로 적용한다(지금 이미지를 유지).
# - 테스트는 로컬에서 돌린 뒤 머지한다 — pytest가 실 DB·data/raw를 써서 CI에서 못 돈다.
# - AWS가 없는 동안(10/14 전, 10/29 정리 뒤)엔 저장소 변수 AWS_DEPLOY_ROLE_ARN을 비워 두면 건너뛴다.
name: backend-deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - data/geojson/**
      - .github/workflows/backend-deploy.yml
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false # 배포 중간에 끊지 않는다

permissions:
  id-token: write # AWS OIDC — 키 없이 역할을 받는다 (infra/terraform github_actions.tf)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  CLUSTER: beyondfacade
  NAMESPACE: beyondfacade

jobs:
  build:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm # 노드가 Graviton(arm64) — 에뮬레이션 없이 네이티브로 빌드
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        run: echo "image=${{ steps.ecr.outputs.registry }}/beyondfacade-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: 이미지 빌드·푸시
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # 태그 불변(ECR IMMUTABLE)이라 같은 커밋을 다시 돌리면 푸시를 건너뛴다
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "이미 있음: $IMAGE"
          else
            docker build --build-context geojson=data/geojson -t "$IMAGE" backend
            docker push "$IMAGE"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-24.04 # aws CLI·kubectl이 깔려 있다
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: API·CronJob 이미지 교체
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          if ! kubectl get deployment/api -n "$NAMESPACE" > /dev/null 2>&1; then
            echo "::notice::아직 배포된 API가 없다 — 첫 배포는 관리자가: scripts/k8s-apply.sh $IMAGE"
            exit 0
          fi
          # 마이그레이션 먼저 — 새 코드가 아직 없는 컬럼을 찾지 않게. 실패하면 이미지를 바꾸지 않는다
          job="db-migrate-${GITHUB_SHA::12}"
          kubectl delete job "$job" -n "$NAMESPACE" --ignore-not-found
          sed -e "s|name: db-migrate|name: $job|" -e "s|image: beyondfacade-api|image: $IMAGE|" deploy/k8s-jobs/db-migrate.yaml | kubectl apply -f -
          for _ in $(seq 60); do  # 최대 5분
            status=$(kubectl get job "$job" -n "$NAMESPACE" -o jsonpath='{.status.succeeded}{.status.failed}')
            [ -n "$status" ] && break
            sleep 5
          done
          kubectl logs "job/$job" -n "$NAMESPACE" || true
          if [ "$(kubectl get job "$job" -n "$NAMESPACE" -o jsonpath='{.status.succeeded}')" != "1" ]; then
            echo "::error::DB 마이그레이션 실패 또는 5분 초과 — 이미지를 바꾸지 않았다"
            exit 1
          fi
          kubectl set image deployment/api "api=$IMAGE" -n "$NAMESPACE"
          kubectl set image cronjob --all "*=$IMAGE" -n "$NAMESPACE"
          # 새 파드가 ready가 안 되면 이전 버전으로 되돌리고 실패로 끝낸다
          if ! kubectl rollout status deployment/api -n "$NAMESPACE" --timeout=5m; then
            kubectl rollout undo deployment/api -n "$NAMESPACE"
            exit 1
          fi
