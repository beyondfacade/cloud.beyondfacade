# main에 백엔드가 바뀌면: arm64 이미지 빌드 → ECR 푸시 → deploy/k8s/kustomization.yaml의 태그를 그 SHA로 커밋 (serverplan §13-1)
# - 클러스터 반영은 Argo CD가 한다(GitOps, infra/terraform addons.tf): main을 보고 DB 마이그레이션(PreSync 훅) → API·CronJob 교체.
#   CI는 클러스터에 접속하지 않는다 — EKS 엔드포인트를 열지 않고, CI 역할엔 EKS 권한이 없다.
# - 태그 커밋이 main에 하나 생기므로, 로컬에서 푸시 전엔 git pull --rebase.
# - 테스트는 로컬에서 돌린 뒤 머지한다 — pytest가 실 DB·data/raw를 써서 CI에서 못 돈다.
# - AWS가 없는 동안(10/14 전, 10/29 정리 뒤)엔 저장소 변수 AWS_DEPLOY_ROLE_ARN을 비워 두면 건너뛴다.
name: backend-deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - data/geojson/**
      - .github/workflows/backend-deploy.yml
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false # 차례대로 — 옛 커밋의 태그가 새 태그를 덮지 않게

permissions:
  id-token: write # AWS OIDC — 키 없이 역할을 받는다 (infra/terraform github_actions.tf)
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm # 노드가 Graviton(arm64) — 에뮬레이션 없이 네이티브로 빌드
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        run: echo "image=${{ steps.ecr.outputs.registry }}/beyondfacade-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: 이미지 빌드·푸시
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # 태그 불변(ECR IMMUTABLE)이라 같은 커밋을 다시 돌리면 푸시를 건너뛴다
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "이미 있음: $IMAGE"
          else
            docker build --build-context geojson=data/geojson -t "$IMAGE" backend
            docker push "$IMAGE"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # 태그 커밋 푸시
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: 배포 태그 커밋 — Argo CD가 이 커밋을 보고 맞춘다
        # 수집 시간(03:30~06:10 KST)엔 Argo CD 동기화 창이 막혀 있어 06:10 뒤에 반영된다
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do  # 그 사이 누가 푸시했으면 최신 main 위에서 다시
            git fetch -q origin main && git reset -q --hard origin/main
            sed -i -E "s/^(    newTag: )[0-9a-f]{40}/\1${GITHUB_SHA}/" deploy/k8s/kustomization.yaml
            if git diff --quiet; then
              echo "이미 ${GITHUB_SHA} — 커밋할 것 없음"
              exit 0
            fi
            git commit -q -am "deploy: backend ${GITHUB_SHA::12}"
            if git push -q origin HEAD:main; then
              echo "::notice::태그 커밋 완료 — Argo CD가 3분 안에 마이그레이션·교체한다"
              exit 0
            fi
            sleep 5
          done
          exit 1
