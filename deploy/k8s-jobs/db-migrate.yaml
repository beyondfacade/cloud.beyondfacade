# DB 마이그레이션 — 새 이미지로 alembic upgrade head (serverplan §13-1)
# 직접 적용하지 않는다: backend-deploy 워크플로가 이름에 커밋 SHA를 붙이고 이미지를 새 것으로 바꿔 적용한 뒤,
# 성공해야 API·CronJob 이미지를 바꾼다. 돌고 있는 옛 파드에는 새 마이그레이션 파일이 없어서 Job으로 띄운다.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: beyondfacade
spec:
  backoffLimit: 0  # 실패하면 배포를 멈추고 사람이 본다
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: migrate
          image: beyondfacade-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: backend-config}
            - secretRef: {name: backend-env}  # DATABASE_URL(RDS)
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
