# API — 파드 1개 = uvicorn 워커 1개, 확장은 파드 수로 (serverplan K4·§7)
# 경계 파일(/data/geojson)은 이미지에 들어 있다 — 빌드는 `docker build --build-context geojson=data/geojson backend` (backend/Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}  # 새 파드가 ready가 된 뒤에 옛 파드를 내린다
  template:
    metadata:
      labels: {app: api}
    spec:
      terminationGracePeriodSeconds: 90  # preStop 10초 + SSE 리포트 최대 60초 + 여유
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: api}
      containers:
        - name: api
          image: beyondfacade-api
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: backend-config}
            - secretRef: {name: backend-env}
          env:
            # 11차 부하 테스트 중에만(serverplan §21-8) — 고정 지연 가짜 LLM, 요금 없음. 리포트는 model='fake'로 남아 scripts/load/aws.sh cleanup이 지운다.
            # ConfigMap이 아니라 여기 두는 이유: 파드 템플릿이 바뀌어야 롤링 재시작된다. 테스트가 끝나면 이 커밋을 revert한다
            - {name: LLM_MODE, value: fake}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}  # 워커 1개라 1코어 넘게 줘도 못 쓴다
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # 엔드포인트 제거와 SIGTERM이 동시에 온다 — ALB가 대상을 빼기 전에 닫혀 502가 나지 않게 기다린다
              exec: {command: ["sleep", "10"]}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - port: 80
      targetPort: 8000
---
# AWS Load Balancer Controller가 이 Ingress로 ALB를 만든다. 인증서는 host로 ACM에서 자동으로 찾는다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"  # http://로 온 요청은 https://로 돌려보낸다 (serverplan §20-9)
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300  # SSE 리포트가 60초 기본값에 끊기지 않게
    alb.ingress.kubernetes.io/target-group-attributes: >-
      deregistration_delay.timeout_seconds=70,load_balancing.algorithm.type=least_outstanding_requests
spec:
  ingressClassName: alb
  tls:
    - hosts: [api.beyondfacade.cloud]
  rules:
    - host: api.beyondfacade.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: {number: 80}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10  # DB 연결 한도(config.yaml)와 같이 움직인다
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleUp:  # 빨리 늘린다 — 15초마다 2배 또는 +4개 중 큰 쪽
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
        - {type: Pods, value: 4, periodSeconds: 15}
    scaleDown:  # 천천히 줄인다 — 5분 지켜본 뒤 1분에 1개
      stabilizationWindowSeconds: 300
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: api}
