# API 파드 — 관리자 수집기 화면(상태·로그·수동 실행)이 이 네임스페이스의 CronJob·Job·파드 로그만 본다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-collectors
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-collectors
subjects:
  - kind: ServiceAccount
    name: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-collectors
