# 비밀값 — Secrets Manager `beyondfacade/prod/backend-env`(JSON 키/값) → Secret `backend-env` (serverplan K8)
# api·CronJob이 envFrom으로 읽는다. AWS 권한은 External Secrets 컨트롤러의 Pod Identity(infra/terraform addons.tf) — auth를 적지 않으면 그 권한을 쓴다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-env
spec:
  refreshInterval: 1h  # 콘솔에서 값을 바꾸면 1시간 안에 반영(파드는 재시작해야 새 값을 읽는다)
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backend-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: beyondfacade/prod/backend-env  # JSON의 키 하나 = env 하나
