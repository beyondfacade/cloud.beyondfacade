# DB 마이그레이션 — 새 이미지로 alembic upgrade head (serverplan §13-1)
# Argo CD PreSync 훅: 동기화마다 API·CronJob보다 먼저 돌고, 실패하면 그 동기화를 멈춘다(이미지가 안 바뀐다).
# 돌고 있는 옛 파드에는 새 마이그레이션 파일이 없어서 Job으로 띄운다.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: beyondfacade
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation  # 다음 동기화 직전에 지운다 — 그때까지 로그를 볼 수 있다
spec:
  backoffLimit: 0  # 실패하면 배포를 멈추고 사람이 본다
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: migrate
          image: beyondfacade-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: backend-config}
            - secretRef: {name: backend-env}  # DATABASE_URL(RDS)
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
