# EKS 운영 매니페스트 (serverplan §4·§6·§7). 적용: kubectl apply -k deploy/k8s
# 계정 ID·ECR 주소·인증서 ARN은 저장소(public)에 넣지 않는다 — 배포 때 `kustomize edit set image`로 이미지만 바꾼다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: beyondfacade
resources:
  - namespace.yaml
  - config.yaml
  - api.yaml
  - cronjobs.yaml
images:
  - name: beyondfacade-api
    newTag: latest  # CI가 git SHA로 덮어쓴다
