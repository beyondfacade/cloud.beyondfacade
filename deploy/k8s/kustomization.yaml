# EKS 운영 매니페스트 (serverplan §4·§6·§7). Argo CD가 main의 이 폴더를 클러스터에 맞춘다(infra/terraform addons.tf)
# 계정 ID·ECR 주소·인증서 ARN은 저장소(public)에 넣지 않는다 — ECR 주소는 Argo CD Application이 이미지 이름에 붙인다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: beyondfacade
resources:
  - namespace.yaml
  - config.yaml
  - external-secret.yaml
  - rbac.yaml
  - api.yaml
  - ollama.yaml
  - ollama-gpu.yaml
  - cronjobs.yaml
  - db-migrate.yaml
images:
  - name: beyondfacade-api
    newTag: 892aa7f004d2bed1b1e6594bc7911f296d1dd825  # backend-deploy가 새 이미지를 올린 뒤 그 git SHA로 커밋한다 — 지금 운영 버전
