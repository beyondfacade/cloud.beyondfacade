# 수집·색인·정리 크론 — 호스트 crontab(scripts/*.sh)과 같은 일정·같은 모듈 (serverplan §1-3)
# 로그는 stdout(파일·tail 정리 불필요). 여러 단계는 앞 단계가 실패하면 멈춘다(scripts의 set -e와 같다).
# 제외: jekyll-devlog(로컬 전용).
---
# 뉴스 증분
apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-poller
spec:
  schedule: "10 * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid  # 겹쳐 돌면 같은 데이터를 두 번 쓴다
  jobTemplate:
    spec:
      backoffLimit: 0  # 호스트 크론처럼 재시도하지 않는다 — 다음 일정에 증분으로 따라잡는다
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001}
          containers:
            - name: news-poller
              image: beyondfacade-api
              command: ["sh", "-c", "python -m apps.news.adapter.inbound.cli.news_poller"]
              envFrom:
                - configMapRef: {name: backend-config}
                - secretRef: {name: backend-env}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {memory: 1Gi}
---
# 인허가 점포·학원·부동산 → 좌표·동 배정 → 지표·판정 재계산
apiVersion: batch/v1
kind: CronJob
metadata:
  name: store-collector
spec:
  schedule: "20 4 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid  # 겹쳐 돌면 같은 데이터를 두 번 쓴다
  jobTemplate:
    spec:
      backoffLimit: 0  # 호스트 크론처럼 재시도하지 않는다 — 다음 일정에 증분으로 따라잡는다
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001}
          containers:
            - name: store-collector
              image: beyondfacade-api
              # geocode_stores의 exit 2는 '미매칭만 남음'(재시도 막기용) — 실패가 아니라서 뒤 단계(지역 배정·지표·판정)를 계속 돌린다
              command: ["sh", "-c", "python -m apps.store.adapter.inbound.cli.store_collector && python -m apps.store.adapter.inbound.cli.academy_collector && python -m apps.store.adapter.inbound.cli.broker_collector && { python -m apps.store.adapter.inbound.cli.geocode_stores || [ $? -eq 2 ]; } && python -m apps.store.adapter.inbound.cli.assign_regions && python -m apps.metric.adapter.inbound.cli.build_metrics && python -m apps.verdict.adapter.inbound.cli.build_verdicts"]
              envFrom:
                - configMapRef: {name: backend-config}
                - secretRef: {name: backend-env}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {memory: 1Gi}
---
