# 설비 지표 표본(관리자 인프라 추세) — /proc은 Job이 뜬 노드 기준
apiVersion: batch/v1
kind: CronJob
metadata:
  name: host-metrics-sampler
spec:
  schedule: "* * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001}
          containers:
            - name: host-metrics-sampler
              image: beyondfacade-api
              command: ["sh", "-c", "python -m apps.ops.adapter.inbound.cli.sample_host_metrics"]
              envFrom:
                - configMapRef: {name: backend-config}
                - secretRef: {name: backend-env}
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {memory: 512Mi}
