# RAG 증분 색인 — bge-m3 임베딩(OLLAMA_BASE_URL)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-indexer
spec:
  # 클러스터 안 Ollama(ollama.yaml)로 임베딩한다 — 10/22 연결, 켤 때 한 번 돌려 밀린 공고를 따라잡았다(증분)
  suspend: false
  schedule: "50 5 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid  # 겹쳐 돌면 같은 데이터를 두 번 쓴다
  jobTemplate:
    spec:
      backoffLimit: 0  # 호스트 크론처럼 재시도하지 않는다 — 다음 일정에 증분으로 따라잡는다
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001}
          containers:
            - name: rag-indexer
              image: beyondfacade-api
              command: ["sh", "-c", "python -m apps.rag.adapter.inbound.cli.build_rag_index --provider bge-m3"]
              envFrom:
                - configMapRef: {name: backend-config}
                - secretRef: {name: backend-env}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {memory: 1Gi}
---
